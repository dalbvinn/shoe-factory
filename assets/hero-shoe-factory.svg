<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="SoleCraft Modern Shoemaking Factory Workshop">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c27838"/>
      <stop offset="50%" stop-color="#934d1b"/>
      <stop offset="100%" stop-color="#5a2c0d"/>
    </linearGradient>
    <linearGradient id="benchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Factory Ambient -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Factory Architecture Elements: Windows & Overhead Light beams -->
  <g opacity="0.12">
    <line x1="120" y1="0" x2="120" y2="280" stroke="#fff" stroke-width="2"/>
    <line x1="260" y1="0" x2="260" y2="280" stroke="#fff" stroke-width="2"/>
    <line x1="400" y1="0" x2="400" y2="280" stroke="#fff" stroke-width="2"/>
    <line x1="540" y1="0" x2="540" y2="280" stroke="#fff" stroke-width="2"/>
    <line x1="680" y1="0" x2="680" y2="280" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- Lighting cone -->
  <polygon points="350,0 450,0 650,420 150,420" fill="url(#goldGlow)" opacity="0.08"/>

  <!-- Artisan Industrial Workbench -->
  <rect x="60" y="360" width="680" height="28" rx="4" fill="url(#benchGrad)"/>
  <rect x="50" y="388" width="700" height="12" fill="#0f172a"/>
  <!-- Bench legs -->
  <rect x="90" y="400" width="28" height="100" fill="#1e293b"/>
  <rect x="680" y="400" width="28" height="100" fill="#1e293b"/>
  <rect x="90" y="460" width="618" height="10" fill="#0f172a"/>

  <!-- Cobbler Equipment Background -->
  <!-- Hanging leather hide cuts -->
  <path d="M 100 80 Q 130 90, 160 85 L 170 200 Q 135 210, 110 190 Z" fill="#78350f" opacity="0.7"/>
  <path d="M 140 85 Q 170 95, 200 90 L 210 230 Q 170 240, 140 215 Z" fill="#92400e" opacity="0.8"/>
  <line x1="80" y1="80" x2="230" y2="80" stroke="#64748b" stroke-width="4"/>

  <!-- Wooden Shoe Last on Stand -->
  <g transform="translate(180, 260)" opacity="0.85">
    <rect x="22" y="55" width="8" height="45" fill="#475569"/>
    <ellipse cx="26" cy="100" rx="20" ry="6" fill="#334155"/>
    <path d="M 10 40 C 20 42, 35 40, 50 25 C 45 15, 30 10, 15 20 Z" fill="#d97706"/>
  </g>

  <!-- Centerpiece: Mastercrafted Goodyear Welted Derby Shoe -->
  <g id="hero-shoe" filter="url(#shadow)" transform="translate(180, 150)">
    <!-- Shadow beneath shoe -->
    <ellipse cx="230" cy="210" rx="210" ry="22" fill="#000000" opacity="0.55"/>
    
    <!-- Sole Profile -->
    <!-- Vibram / Leather welted double outsole -->
    <path d="M 60 185 C 100 188, 160 188, 220 180 C 270 174, 320 178, 380 188 C 420 195, 435 188, 430 178 C 375 168, 320 166, 260 172 C 200 178, 140 178, 70 172 C 55 171, 50 178, 60 185 Z" fill="#2d1b09"/>
    <path d="M 60 192 C 100 195, 160 195, 220 186 C 270 180, 320 184, 385 195 C 425 202, 440 195, 432 184 C 375 174, 320 172, 260 178 C 200 184, 140 184, 70 178 C 55 177, 50 185, 60 192 Z" fill="#170d04"/>
    <!-- Stacked Heel -->
    <path d="M 60 176 L 62 198 C 62 201, 115 201, 120 198 L 122 178 Z" fill="#381d09"/>
    <line x1="62" y1="184" x2="121" y2="184" stroke="#d97706" stroke-width="1.5" stroke-dasharray="2 1"/>
    <line x1="62" y1="191" x2="121" y2="191" stroke="#b45309" stroke-width="1.5"/>

    <!-- Welt Stitching Line -->
    <path d="M 72 173 C 140 179, 210 179, 265 172 C 320 167, 370 170, 420 178" fill="none" stroke="#fcd34d" stroke-width="2" stroke-dasharray="3 2"/>

    <!-- Shoe Upper - Italian Calf Leather -->
    <path d="M 70 172 
             C 70 150, 75 110, 95 90 
             C 120 70, 150 78, 175 110 
             C 200 140, 240 135, 290 140 
             C 340 145, 390 155, 420 168 
             C 435 175, 430 180, 410 180 
             C 360 172, 310 169, 260 172 
             C 200 178, 140 178, 70 172 Z" fill="url(#leatherGrad)"/>

    <!-- Heel counter overlay -->
    <path d="M 70 172 C 70 150, 75 110, 95 90 C 105 82, 118 80, 125 95 C 115 130, 120 155, 130 174 C 105 174, 85 173, 70 172 Z" fill="#78350f" opacity="0.9"/>
    <path d="M 95 90 C 105 82, 118 80, 125 95 C 115 130, 120 155, 130 174" fill="none" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="2 2"/>

    <!-- Vamp & Toe Cap Broguing & Medallion -->
    <path d="M 330 145 C 335 160, 340 170, 350 174" fill="none" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="2 2"/>
    <!-- Brogue holes along toe cap line -->
    <circle cx="335" cy="150" r="1.5" fill="#381d09"/>
    <circle cx="340" cy="158" r="1.5" fill="#381d09"/>
    <circle cx="345" cy="166" r="1.5" fill="#381d09"/>

    <!-- Lacing Quarters & Eyestay -->
    <path d="M 175 110 C 205 138, 235 133, 265 140 L 255 158 C 225 152, 195 155, 170 135 Z" fill="#582106"/>
    <!-- Brass Eyelets & Waxed Laces -->
    <circle cx="195" cy="125" r="2.5" fill="#fbbf24"/>
    <circle cx="212" cy="130" r="2.5" fill="#fbbf24"/>
    <circle cx="230" cy="135" r="2.5" fill="#fbbf24"/>
    <circle cx="248" cy="140" r="2.5" fill="#fbbf24"/>
    
    <!-- Laces criss-cross -->
    <line x1="195" y1="125" x2="212" y2="130" stroke="#fef3c7" stroke-width="2"/>
    <line x1="212" y1="130" x2="230" y2="135" stroke="#fef3c7" stroke-width="2"/>
    <line x1="230" y1="135" x2="248" y2="140" stroke="#fef3c7" stroke-width="2"/>
    <!-- Lace bow -->
    <path d="M 195 125 C 180 110, 175 120, 190 128 C 175 135, 180 145, 196 128" fill="none" stroke="#fef3c7" stroke-width="2"/>

    <!-- Leather Luster Highlight -->
    <path d="M 150 95 C 190 125, 260 135, 340 145 C 380 150, 405 160, 400 162 C 340 152, 260 140, 190 125 C 160 115, 145 105, 150 95 Z" fill="#ffffff" opacity="0.2"/>
  </g>

  <!-- Artisan Cobbler Tools on Desk -->
  <!-- Cobbler's Hammer -->
  <g transform="translate(560, 335) rotate(-15)">
    <rect x="0" y="22" width="110" height="10" rx="3" fill="#b45309"/>
    <rect x="95" y="10" width="30" height="34" rx="4" fill="#94a3b8"/>
    <path d="M 125 18 L 138 27 L 125 36 Z" fill="#64748b"/>
  </g>

  <!-- Awl / Marking Tool -->
  <g transform="translate(120, 350) rotate(10)">
    <ellipse cx="20" cy="10" rx="18" ry="8" fill="#78350f"/>
    <path d="M 38 10 L 85 10" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Factory Badge Overlay -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="180" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#22c55e"/>
    <text x="36" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">CRAFTED IN WORKSHOP</text>
  </g>
</svg>
