<svg id="customizer-svg-canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" aria-label="Customizable Shoe Interactive Model">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground Plane Shadow -->
  <ellipse id="customizer-shadow" cx="300" cy="310" rx="240" ry="20" fill="#cbd5e1" opacity="0.7"/>

  <g id="shoe-assembly" filter="url(#softShadow)" transform="translate(60, 40)">
    
    <!-- SOLE LAYER (Targetable by ID) -->
    <g id="customizer-sole-group">
      <!-- Outsole base -->
      <path id="customizer-sole" d="M 60 230 C 120 234, 200 234, 280 224 C 330 216, 380 220, 440 232 C 475 238, 485 230, 475 220 C 420 208, 360 206, 300 212 C 220 218, 140 218, 70 212 C 50 210, 45 222, 60 230 Z" fill="#d97706" stroke="#b45309" stroke-width="2"/>
      
      <!-- Heel Block -->
      <path id="customizer-heel" d="M 60 218 L 62 245 C 68 248, 125 248, 130 245 L 132 220 Z" fill="#92400e"/>

      <!-- Midsole stitch / welt line -->
      <path id="customizer-welt" d="M 72 214 C 150 220, 240 220, 310 212 C 370 206, 420 210, 465 220" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="3 2"/>
    </g>

    <!-- UPPER BODY LAYER (Targetable by ID) -->
    <g id="customizer-upper-group">
      <path id="customizer-upper" d="M 70 212 
               C 70 170, 78 120, 108 100 
               C 138 80, 175 88, 205 125 
               C 238 160, 280 155, 340 162 
               C 395 168, 440 180, 470 196 
               C 485 204, 480 214, 455 214 
               C 400 206, 350 202, 290 206 
               C 220 212, 150 212, 70 212 Z" fill="#b86b35" stroke="#7c3f15" stroke-width="2"/>
    </g>

    <!-- ACCENT / TOE CAP & HEEL OVERLAY (Targetable by ID) -->
    <g id="customizer-accent-group">
      <!-- Heel Counter Overlay -->
      <path id="customizer-heel-counter" d="M 70 212 C 70 170, 78 120, 108 100 C 120 92, 135 90, 142 105 C 130 145, 136 180, 145 214 C 115 214, 90 213, 70 212 Z" fill="#78350f" opacity="0.95"/>
      <!-- Toe Cap Overlay -->
      <path id="customizer-toe-cap" d="M 370 166 C 380 185, 390 198, 405 205 L 455 214 C 480 214, 485 204, 470 196 C 440 180, 405 170, 370 166 Z" fill="#78350f" opacity="0.95"/>
      <!-- Brogue punch details on toe -->
      <circle cx="390" cy="180" r="2" fill="#fef08a"/>
      <circle cx="400" cy="190" r="2" fill="#fef08a"/>
      <circle cx="415" cy="200" r="2" fill="#fef08a"/>
    </g>

    <!-- LACES & EYESTAY LAYER (Targetable by ID) -->
    <g id="customizer-laces-group">
      <!-- Eyestay facing -->
      <path d="M 205 125 C 240 155, 275 150, 310 158 L 295 180 C 260 172, 225 175, 198 152 Z" fill="#582106"/>
      <!-- Brass Eyelets -->
      <circle cx="225" cy="142" r="3" fill="#fbbf24"/>
      <circle cx="248" cy="148" r="3" fill="#fbbf24"/>
      <circle cx="272" cy="154" r="3" fill="#fbbf24"/>
      <circle cx="295" cy="160" r="3" fill="#fbbf24"/>

      <!-- Laces (Path can be recolored) -->
      <g id="customizer-laces" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round">
        <line x1="225" y1="142" x2="248" y2="148"/>
        <line x1="248" y1="148" x2="272" y2="154"/>
        <line x1="272" y1="154" x2="295" y2="160"/>
        <path d="M 225 142 C 205 125, 200 135, 218 145 C 200 152, 205 165, 224 146" fill="none"/>
      </g>
    </g>

    <!-- PERSONALIZED MONOGRAM STAMP (Targetable by ID) -->
    <g id="customizer-monogram-group" transform="translate(100, 150) rotate(-10)">
      <rect x="0" y="0" width="36" height="24" rx="4" fill="rgba(245, 158, 11, 0.2)" stroke="#e5a950" stroke-width="1" stroke-dasharray="2 1"/>
      <text id="customizer-monogram" x="18" y="16" font-family="'Plus Jakarta Sans', serif" font-size="11" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="1">SC</text>
    </g>

    <!-- Highlight sheen -->
    <path d="M 170 105 C 220 140, 300 150, 400 165 C 440 172, 465 185, 460 188 C 390 174, 300 160, 220 140 C 180 128, 165 116, 170 105 Z" fill="#ffffff" opacity="0.18"/>
  </g>
</svg>
