<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" role="img" aria-label="SoleCraft Factory Campus Map and Tour Route">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="350" rx="12" fill="url(#mapBg)"/>

  <!-- Campus Grid Layout -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="70" x2="600" y2="70"/>
    <line x1="0" y1="140" x2="600" y2="140"/>
    <line x1="0" y1="210" x2="600" y2="210"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="300" y1="0" x2="300" y2="350"/>
    <line x1="400" y1="0" x2="400" y2="350"/>
    <line x1="500" y1="0" x2="500" y2="350"/>
  </g>

  <!-- Factory Buildings -->
  <!-- Building A: Master Cobbler Workshop -->
  <rect x="60" y="80" width="160" height="110" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
  <text x="75" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">BUILDING A</text>
  <text x="75" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Bespoke Lasting</text>
  <text x="75" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">&amp; Hand Welt Shop</text>

  <!-- Building B: Automated CNC & Molding Facility -->
  <rect x="260" y="80" width="260" height="110" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
  <text x="275" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">BUILDING B</text>
  <text x="275" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">High-Capacity Laser Cutting</text>
  <text x="275" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">&amp; Vulcanization Line</text>

  <!-- Building C: Visitor Center & Client Showroom -->
  <rect x="60" y="220" width="220" height="90" rx="8" fill="#1e293b" stroke="#b86b35" stroke-width="2"/>
  <text x="75" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#e5a950">VISITOR CENTER</text>
  <text x="75" y="275" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#cbd5e1">Guest Reception &amp; Design Lounge</text>
  <circle cx="250" cy="245" r="8" fill="#22c55e"/>
  <circle cx="250" cy="245" r="4" fill="#ffffff"/>

  <!-- Tour Path Dashed Line -->
  <path d="M 170 310 L 170 200 L 240 200 L 240 140 L 260 140" fill="none" stroke="#e5a950" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Address Marker Pin -->
  <g transform="translate(390, 230)">
    <rect x="0" y="0" width="170" height="65" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#64748b"/>
    <text x="15" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Northampton District</text>
    <text x="15" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">104 Industrial Craft Way</text>
    <text x="15" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#22c55e">● Open for Industry Tours</text>
  </g>
</svg>
